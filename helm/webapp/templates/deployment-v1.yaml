apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-v1

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: web
      version: v1

  template:
    metadata:
      labels:
        app: web
        version: v1

    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 80
