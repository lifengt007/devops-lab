apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-v2

spec:

  replicas: 1

  selector:

    matchLabels:
      app: web
      version: v2

  template:

    metadata:

      labels:
        app: web
        version: v2

    spec:

      containers:

        - name: web

          #Testing bad image issue
          #image: devops-web:v2
          image: devops-web:v999999

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 80
